[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch-mutants"
version = "0.1.0"
description = "Finds the bugs your tests would let through: LLM-generated realistic mutants on your PR's changed lines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openai>=1.30", "pytest>=7"]

[project.scripts]
snitch = "snitch.cli:main"

[tool.setuptools]
packages = ["snitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
